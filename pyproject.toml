[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.0.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.1",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
